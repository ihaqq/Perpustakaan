<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIPERPUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-indigo: #5c6ac4; /* Warna indigo sesuai identitas SIPERPUS */
            --primary-hover: #4a55a2;
            --bg-light: #f0f4f8;
            --text-main: #333;
            --text-gray: #888;
            --border-color: #e0e6ed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-light);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 380px; /* Ukuran diperkecil agar tidak terlalu lebar */
            padding: 2rem;    /* Padding dikurangi agar tidak terlihat 'gemuk' */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            text-align: center;
            position: relative;
        }

        .logo-wrapper {
            width: 70px; /* Ukuran logo diperkecil sedikit */
            height: 70px;
            background: white;
            border-radius: 50%;
            margin: -65px auto 15px; /* Margin disesuaikan */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 4px solid white;
        }

        .logo-wrapper img {
            width: 70%;
            height: auto;
            object-fit: contain;
        }

        h2 { 
            color: var(--text-main); 
            margin-bottom: 1.5rem; /* Jarak bawah judul dikurangi */
            font-weight: 600; 
            font-size: 1.5rem; 
        }

        .form-group {
            margin-bottom: 1rem; /* Jarak antar input lebih rapat tapi rapi */
            text-align: left;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 45px; /* Padding vertikal dikurangi sedikit */
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: 0.2s ease;
            background-color: #fff;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-indigo);
            box-shadow: 0 0 0 3px rgba(92, 106, 196, 0.06);
        }

        .field-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-gray);
            pointer-events: none;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-gray);
            cursor: pointer;
            transition: fill 0.2s;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin: 1rem 0 1.5rem; /* Margin diatur agar lebih lega */
            color: var(--text-gray);
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary-indigo);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s ease;
            box-shadow: 0 4px 10px rgba(92, 106, 196, 0.15);
        }

        .btn-login:hover { background: var(--primary-hover); }

        .divider {
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            color: #ddd;
            font-size: 0.7rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
            margin: 0 10px;
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #555;
        }

        .signup-text {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .signup-text a { color: var(--primary-indigo); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-wrapper">
            <img src="logo.png" alt="Siperpus">
        </div>

        <h2>Welcome Back!</h2>

        <form action="#">
            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <input type="text" placeholder="Username" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                    </svg>
                    <input type="password" id="password" placeholder="Password" required>
                    <svg class="password-toggle" id="togglePassword" viewBox="0 0 24 24">
                        <path id="eye-path" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </div>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> 
                    <span>Remember me</span>
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">LOGIN</button>
        </form>

        <div class="divider">OR</div>

        <button type="button" class="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            Sign in with Google
        </button>

        <p class="signup-text">
            Don't have an account? <a href="#">Sign up</a>
        </p>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordField = document.querySelector('#password');
        const eyePath = document.querySelector('#eye-path');

        // Path SVG Mata Terbuka & Mata Tertutup (Garis Miring)
        const eyeOpen = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
        const eyeClosed = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z";

        togglePassword.addEventListener('click', function () {
            const isPassword = passwordField.getAttribute('type') === 'password';
            passwordField.setAttribute('type', isPassword ? 'text' : 'password');
            eyePath.setAttribute('d', isPassword ? eyeClosed : eyeOpen);
        });
    </script>
</body>
</html>
